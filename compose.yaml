version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vector-forge-backend
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/vector_forge.db
      - MCP_TRANSPORT=http
      - DEMO_MODE=true
      - DATA_DIR=/app/data
      - SNAPSHOT_DIR=/app/data/snapshots
      - TEMP_DIR=/app/data/temp
    volumes:
      - backend-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health/ready', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - vector-forge-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vector-forge-frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vector-forge-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: vector-forge-keycloak
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    command: start-dev --http-port=8081 --hostname=localhost
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/health/ready"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - vector-forge-network
    restart: unless-stopped

volumes:
  backend-data:
  keycloak-data:

networks:
  vector-forge-network:
    driver: bridge