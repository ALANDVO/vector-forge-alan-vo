name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=. .venv/bin/python -m pytest tests/ -v --tb=short

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: vector-forge-backend:test
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: vector-forge-frontend:test
          load: true

      - name: Test backend image
        run: |
          docker run --rm -d --name backend-test -p 8000:8000 \
            -e ENVIRONMENT=test -e DEMO_MODE=true \
            vector-forge-backend:test
          sleep 10
          curl -f http://127.0.0.1:8000/health/ready
          docker stop backend-test

      - name: Test frontend image
        run: |
          docker run --rm -d --name frontend-test -p 8080:8080 \
            vector-forge-frontend:test
          sleep 5
          curl -f http://127.0.0.1:8080/
          docker stop frontend-test

  compose-test:
    name: Compose Integration Test
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Start compose
        run: |
          docker compose up -d --build
          sleep 30

      - name: Test services
        run: |
          curl -f http://127.0.0.1:8000/health/ready
          curl -f http://127.0.0.1:8080/
          curl -f http://127.0.0.1:8081/health/ready

      - name: Cleanup
        run: docker compose down -v